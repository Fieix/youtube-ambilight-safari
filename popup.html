<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ambient light</title>
  <style>
    body { margin: 0; width: 320px; background: #0f0f0f; color: #f1f1f1; font: 13px/1.3 -apple-system, sans-serif; }
    #panel { max-height: 520px; overflow: auto; padding: 12px; }
    h2 { margin: 14px 0 6px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: #aaa; white-space: normal; }
    .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .row span { flex: 1; min-width: 7.5em; white-space: normal; }
    input[type="range"] { width: 110px; flex: 0 0 110px; }
    input[type="checkbox"] { flex: 0 0 auto; margin-left: auto; }
    b { min-width: 2.5em; text-align: right; font-weight: 500; }
  </style>
</head>
<body>
  <div id="panel"></div>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
